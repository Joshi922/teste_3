<style id="ctonia-flow-bg">
/* ===== Fundo vivo Ctônia: degradê animado (efeito.css) — claro e escuro ===== */
/* Quadros-chave: o fundo "passeia" pelo degradê ampliado */
/* (quadros-chave antigos removidos: animavam background-position, que repinta a tela inteira a cada frame) */
html{
 /* Claro: azul-claro/teal e amarelo/creme (cores do efeito.css) */
 --ctf-grad:linear-gradient(-45deg,#cde6e3,#fdf1d0,#e0f2f1,#fcf4dd);
 background-color:#e6e2cb!important;min-height:100%;
}
html:not(.light){
 /* Escuro: mesma lógica (teal + dourado), em tons profundos */
 --ctf-grad:linear-gradient(-45deg,#171426,#17323a,#211f38,#32291f);
 background-color:#171426!important;
}
html:is(.light,:not(.light)):is(.hub-light,:not(.hub-light)) body{background:transparent!important;background-image:none!important;background-color:transparent!important}
/* Camada fixa atrás de tudo; .fundo-animado = a classe do efeito.css */
#ct-flow{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
/* Fundo vivo OTIMIZADO: o degradê (4x a largura da tela) fica numa camada própria e só se desloca via
   transform (acelerado por GPU, sem repintar). Visual igual ao anterior. */
.fundo-animado{background:none!important}
#ct-flow::before{content:"";position:absolute;top:0;left:0;width:400%;height:100%;background:var(--ctf-grad);
  will-change:transform;animation:ctfPan 15s ease infinite;animation-delay:var(--ctf-d1,0s)}
@keyframes ctfPan{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(-75%,0,0)}}
/* Biblioteca/Gerenciador abertos cobrem a tela: pausa o fundo do portal que ficou por trás */
html:has(#ctonia-library-overlay:not(.hidden)) #ct-flow::before,
html:has(#ctonia-manager-overlay:not(.hidden)) #ct-flow::before{animation-play-state:paused}
/* Relógio no tema claro: sem retângulo azul, mesma cor da barra */
html:is(.light,.hub-light):is(.light,.hub-light,:not(.x)) body .ct-astro-clock,
html:is(.light,.hub-light):is(.light,.hub-light,:not(.x)) body .ct-astro .ct-astro-clock,
html:is(.light,.hub-light):is(.light,.hub-light,:not(.x)) body #portal-view .ct-astro-clock{background:none!important;background-image:none!important;background-color:transparent!important;box-shadow:none!important;border:0!important}
@media (prefers-reduced-motion:reduce){#ct-flow::before{animation:none!important}}
/* Telas do app: todas transparentes para o fundo aparecer (vence html.light #portal-view etc.) */
html:is(.light,:not(.light)) body #portal-view,
html:is(.light,:not(.light)) body #hub-view,
html:is(.light,:not(.light)) body #workspace-view{background:transparent!important;background-image:none!important;background-color:transparent!important}
#ctonia-library-overlay,#ctonia-manager-overlay,#ctonia-library-frame,#ctonia-manager-frame{background:transparent!important}
html.light .portal-header{background:rgba(235,229,210,.78)!important}
html:not(.light) .portal-header{background:rgba(25,24,43,.78)!important}
</style>
<script id="ctonia-flow-js">(function(){var d=document.documentElement,n=Date.now()/1000;d.style.setProperty('--ctf-d1',(-(n%15)).toFixed(2)+'s');function m(){var b=document.body;if(!b||document.getElementById('ct-flow'))return;var f=document.createElement('div');f.id='ct-flow';f.className='fundo-animado';f.setAttribute('aria-hidden','true');b.insertBefore(f,b.firstChild)}if(document.body)m();else document.addEventListener('DOMContentLoaded',m)})();</script>

        <svg id="fs-icon" aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
    <button id="install-btn" type="button" onclick="installCtonia()" aria-label="Instalar app" title="Instalar o Ctônia como app" style="display:none;position:fixed;top:max(12px,env(safe-area-inset-top));right:max(112px,calc(env(safe-area-inset-right) + 112px));z-index:99998;width:40px;height:40px;border-radius:9999px;align-items:center;justify-content:center;border:1px solid rgb(var(--night));background:rgb(var(--indigo));color:rgb(var(--mystic));cursor:pointer">
        <svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg>
    </button>
    <button id="theme-toggle" onclick="toggleTheme()" aria-label="Alternar tema claro/escuro" class="fixed top-3 right-4 z-[60] w-10 h-10 rounded-full border border-night bg-indigo text-mystic hover:text-luminous shadow-lg flex items-center justify-center transition-colors"><i id="theme-icon" class="fas fa-moon"></i></button>

    <!-- PORTAL INICIAL CTÔNIA -->
    <div id="portal-view" class="relative z-10 flex-1 overflow-y-auto">
        <header class="portal-header px-5 py-5 md:py-6 text-center">
            <div class="portal-brand text-3xl md:text-5xl font-bold uppercase text-salmon title-glow">Ctônia</div>
            <p class="mt-2 text-[10px] md:text-xs uppercase tracking-[.34em] text-mystic">Portal de ferramentas</p>
        </header>
        <main class="max-w-[1500px] mx-auto px-5 md:px-10 py-10 md:py-14">
            <div data-ct-astro aria-label="Relógio e painel astrológico"></div>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4 md:gap-5 items-stretch">
                <button type="button" class="portal-card" onclick="enterPdfHub()" aria-label="Abrir Forja">
                    <i class="portal-symbol fa-solid fa-fire-flame-curved" aria-hidden="true"></i>
                    <span class="portal-card-title">Forja</span>
                </button>
                <a class="portal-card" href="#arquivo" aria-label="Abrir Academia Ctônia" onclick="event.preventDefault();openCtoniaAcademia()">
                    <i class="portal-symbol fa-solid fa-graduation-cap" aria-hidden="true"></i>
                    <span class="portal-card-title">Academia</span>
                </a>
                <a class="portal-card" href="#arquivo" aria-label="Abrir Biblioteca Ctônia" onclick="openCtoniaLibrary()">
                    <i class="portal-symbol fa-solid fa-book-open" aria-hidden="true"></i>
                    <span class="portal-card-title">Biblioteca</span>
                </a>
                <a class="portal-card" href="#arquivo" aria-label="Abrir Laboratório Ctônia" onclick="portalPlaceholder(event,'Laboratório')">
                    <i class="portal-symbol fa-solid fa-flask" aria-hidden="true"></i>
                    <span class="portal-card-title">Laboratório</span>
                </a>
                <button type="button" class="portal-card" aria-label="Abrir Gerenciar Ctônia" onclick="openCtoniaManager()">
                    <i class="portal-symbol fa-regular fa-compass" aria-hidden="true"></i>
                    <span class="portal-card-title">Gerenciar</span>
                </button>
            </div>
            <div class="ct-backup-bar">
                <button type="button" onclick="ctBackupExport()" title="Baixa um arquivo com todos os dados do site"><i class="fa-solid fa-download"></i> Gerar backup</button>
                <button type="button" onclick="ctBackupImport()" title="Restaura os dados a partir de um arquivo de backup"><i class="fa-solid fa-upload"></i> Importar backup</button>
                <button type="button" id="ct-sync-btn" onclick="CTS.open()" title="Sincroniza Gerenciar, Academia e Medições entre PC e celular pelo Google Drive"><i class="fa-solid fa-cloud-arrow-up"></i> Sincronizar aparelhos</button>
                <span id="ct-backup-info"></span> <span id="ct-sync-info"></span>
            </div>
            <p class="text-center text-[10px] uppercase tracking-[.2em] text-mystic/70 mt-6">Conhecimento · Criação · Organização</p>
        </main>
    </div>

    <!-- VIEW PRINCIPAL (HUB) -->

    <!-- VIEW DO WORKSPACE -->
    <div id="workspace-view" class="relative z-20 h-screen w-full hidden flex flex-col bg-abyssal">
